<!DOCTYPE html>
<html>
<head>
    <title>Product List - Shopping Style</title>

    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart {
            background: #28a745;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
        }

        .product-container {
            display: flex;
            gap: 25px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            width: 230px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
            text-align: center;
        }

        .product:hover {
            transform: translateY(-8px);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-content {
            padding: 15px;
        }

        .price {
            color: #007bff;
            font-weight: bold;
            margin: 8px 0;
        }

        button {
            padding: 8px 12px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        button:disabled {
            background-color: gray;
            cursor: not-allowed;
        }

        .added-msg {
            color: green;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Our Products</h2>
    <div class="cart">
        🛒 Cart: <span id="cartCount">0</span>
    </div>
</div>

<div class="product-container" id="productContainer">

    <div class="product">
        <img src="https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b?w=400" alt="Smart Watch">
        <div class="product-content">
            <h4>Smart Watch</h4>
            <p class="price">$99</p>
            <button class="add-btn">Add to Cart</button>
            <p class="added-msg"></p>
        </div>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Headphones">
        <div class="product-content">
            <h4>Headphones</h4>
            <p class="price">$149</p>
            <button class="add-btn">Add to Cart</button>
            <p class="added-msg"></p>
        </div>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400" alt="Laptop">
        <div class="product-content">
            <h4>Laptop</h4>
            <p class="price">$799</p>
            <button class="add-btn">Add to Cart</button>
            <p class="added-msg"></p>
        </div>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" alt="Smartphone">
        <div class="product-content">
            <h4>Smartphone</h4>
            <p class="price">$699</p>
            <button class="add-btn">Add to Cart</button>
            <p class="added-msg"></p>
        </div>
    </div>

</div>

<script>
$(document).ready(function () {

    let count = 0;

    $("#productContainer").on("click", ".add-btn", function () {

        count++;

        $("#cartCount").text(count);

        $(this).prop("disabled", true);
        $(this).text("Added");
        $(this).attr("title", "Product already added");

        $(this).siblings(".added-msg")
               .text("Product added successfully!");
    });

});
</script>

</body>
</html>
