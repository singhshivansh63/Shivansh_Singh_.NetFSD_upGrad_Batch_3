<!DOCTYPE html>
<html>
<head>
    <title>Interactive To-Do List</title>

     
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .todo-container {
            width: 400px;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
        }

        .stats {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="todo-container">

    <h2>To-Do List</h2>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="stats">
        Total Tasks: <span id="totalCount">0</span> |
        Completed: <span id="completedCount">0</span>
    </div>

</div>

<script>
$(document).ready(function () {

    // Add Task
    $("#addBtn").click(function () {

        let taskText = $("#taskInput").val().trim();

        if (taskText !== "") {

            $("#taskList").append(
                "<li>" +
                "<span class='task-text'>" + taskText + "</span>" +
                "<button class='delete-btn'>Delete</button>" +
                "</li>"
            );

            $("#taskInput").val("");
            updateCounts();
        }
    });

    // Mark Complete (Event Delegation)
    $("#taskList").on("click", ".task-text", function () {

        $(this).toggleClass("completed");
        updateCounts();
    });

    // Delete Task
    $("#taskList").on("click", ".delete-btn", function () {

        $(this).parent().remove();
        updateCounts();
    });

    // Function to Update Counts
    function updateCounts() {

        let total = $("#taskList li").length;
        let completed = $("#taskList .completed").length;

        $("#totalCount").text(total);
        $("#completedCount").text(completed);
    }

});
</script>

</body>
</html>
